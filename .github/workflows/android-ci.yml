name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "android"
      KEY_PASSWORD: "android"
      GRADLE_OPTS: "-Dfile.encoding=UTF-8 -XX:+UseG1GC"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Provision Required Keystores & Environment
        run: |
          # 1. Setup .env from .env.example if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # 2. Provision debug.keystore required for debugConfig
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
              echo "Generating debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Provision my-upload-key.jks required for release signing configuration
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating fallback my-upload-key.jks..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Upload,O=AIStudio,C=US"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

          # 4. Provision fallback google-services.json if missing
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"1074941034305","project_id":"gen-lang-client-0231698851","storage_bucket":"gen-lang-client-0231698851.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1074941034305:android:953acd3da7e19cafee2bc0","android_client_info":{"package_name":"com.aistudio.applet.tdequr"}},"oauth_client":[{"client_id":"1074941034305-l4gubmnrsscuvk4e0fmado64kip33qq1.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDoUvxZu7yjbbKTXXAvPBdgjNTE202G0Dc"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew clean testDebugUnitTest --continue --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
