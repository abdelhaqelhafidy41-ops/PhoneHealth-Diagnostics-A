name: Android Test APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Diagnose Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::gradlew was not found in the repository root."
            exit 1
          fi

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          chmod +x gradlew

          echo "Java version:"
          java -version

          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        id: build_apk
        shell: bash
        env:
          GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        run: |
          set -o pipefail

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee build.log

      - name: Upload Test APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report Result
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build_apk.outcome }}
        run: |
          if [ "$BUILD_STATUS" = "success" ]; then
            echo "Debug APK built successfully."
          else
            echo "::error::Android build failed. Download android-build-diagnostic-log to inspect the compiler error."
          fi
          
