name: Android Test APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"

          if [ -z "${ANDROID_HOME:-}" ] || \
             [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "::error::Android SDK or platform-tools not found."
            exit 1
          fi

          adb version || true
          java -version

      - name: Verify Gradle Project
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew || {
            echo "::error::gradlew not found."
            exit 1
          }

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        id: build_apk
        shell: bash
        env:
          GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        run: |
          set -o pipefail

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee build.log

      - name: Upload Test APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostic Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report Build Result
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build_apk.outcome }}
        run: |
          if [ "$BUILD_STATUS" = "success" ]; then
            echo "Debug APK built successfully."
          else
            echo "::error::Build failed. Download android-build-diagnostic-log."
          fi
          
